#The Workflow name - apperas in the Github Actions tab
name: Pulse - Daily Summary Bot

#when to run this workflow
on:
  # Scheduled run : 2:30 AM UST = 8:00 AM IST
  schedule:
    - cron: '30 2 * * *'


  # Manual Trigger: dds a "Run workflow" button in the Actions tab.
  # use this to text anytime without waiting for the corn.
  workflow_dispatch:


# The jobs this workflow runs
jobs:
  run-pulse:                      #job name (Your Choice )
    runs-on: ubuntu-latest        #use Github's free ubuntu server


    steps:

        #Step 1 : Get your code onto the server
        - name : Checkout code
          uses: actions/checkout@v4          # official action - clones your repo 


        #Step 2 : InstalL Python 3.11
        - name: Set up Python 
          uses: actions/setup-python@v5      # official action - sets up python
          with:
            python-version: '3.11'           # specify the version you need
        

        #Step 3 : Install the requests library
        - name: Install dependencies
          run: pip install -r requirements.txt   # install all dependencies listed in requirements.txt
        
         #Step 4 : Run your bot 
        - name: Run Pulse Bot
            env:
              WEATHER_API_KEY: ${{ secrets.WEATHER_API_KEY }}
            run: python bot.py            # command to run your bot (adjust if your main file is named differently)

        
        #Step 5 : Save the Output file as you can download it.
        - name: Upload summary as artifact
            uses: actions/upload-artifact@v4
            with:
              name: daily-summary 
              path: daily_summary.txt                    # name of the artifact
                               # path to the file you want to save (adjust if your output file is named differently)
              
       
       
       
   